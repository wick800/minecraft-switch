name: SwitchCraft - Testar download do Minecraft

on:
  workflow_dispatch:

jobs:
  baixar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar download do Minecraft 1.12.2
        run: python3 fetch.py 1.12.2

      - name: Conferir arquivos baixados
        run: |
          echo "=== RESULTADO ==="
          test -s game/1.12.2.jar
          echo "JAR do Minecraft 1.12.2 baixado com sucesso"
          find game/libraries -type f | wc -l
          echo "bibliotecas baixadas"
          find game/assets/objects -type f | wc -l
          echo "objetos de assets baixados"
